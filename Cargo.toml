[package]
name = "amitoki-relay-postgres"
version = "0.2.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
bytes = "1"
deadpool-postgres = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
amitoki-relay = { git = "https://github.com/amitoki/amitoki", rev = "a5b72966af1dcd64971ef46b2748e2e1df18cbac" }
amitoki-plugin-sdk = { git = "https://github.com/amitoki/amitoki", rev = "a5b72966af1dcd64971ef46b2748e2e1df18cbac" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "amitoki-plugin-postgres"
path = "src/main.rs"
