name: Plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17', '18']
    env:
      POSTGRES_IMAGE: postgres:${{ matrix.postgres }}-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: bash scripts/test-postgres.sh
      - run: cargo build --release --locked
      - uses: actions/checkout@v4
        with:
          repository: amitoki/amitoki
          ref: a5b72966af1dcd64971ef46b2748e2e1df18cbac
          path: .packaging
          persist-credentials: false
      - run: python3 .packaging/scripts/package-plugin.py target/release/amitoki-plugin-postgres dist
      - uses: actions/upload-artifact@v4
        with:
          name: amitoki-plugin-postgres-x86_64-linux-pg${{ matrix.postgres }}
          path: dist/
